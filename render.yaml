services:
  - type: web
    name: freedata-ai-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: RENDER
        value: "true"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: ALLOW_LOCALHOST_CORS
        value: "0"
      - key: ENABLE_DOCS
        value: "0"
      # Passer à "1" uniquement lorsqu'un endpoint d'émission de jetons Bearer (/api/v1/auth) sera déployé.
      - key: REQUIRE_SIGNED_USER_AUTH
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: PREMIUM_API_KEYS
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: ADMIN_TOKENS
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CHECKOUT_URL
        sync: false
      - key: PLAN_PREMIUM_PRICE_XAF
        sync: false
      - key: MOBILE_MONEY_AIRTEL_NUMBER
        sync: false
      - key: MOBILE_MONEY_MOOV_NUMBER
        sync: false
      - key: BANK_TRANSFER_DETAILS
        sync: false
      - key: LLM_API_KEY
        sync: false

