services:
  - type: web
    name: freedata-ai-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: RENDER
        value: "true"
      - key: ALLOW_LOCALHOST_CORS
        value: "0"
      - key: ENABLE_DOCS
        value: "0"
      - key: REQUIRE_SIGNED_USER_AUTH
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PREMIUM_API_KEYS
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: LLM_API_KEY
        sync: false

