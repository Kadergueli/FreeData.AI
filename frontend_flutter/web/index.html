<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="FreeData.AI — Plateforme d'IA multi-domaines : assistance intelligente, recherche documentaire (RAG), analyse de données, prévisions ML et rapports PDF.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FreeData.AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="preconnect" href="https://freedata-ai.onrender.com" crossorigin>
  <link rel="dns-prefetch" href="https://freedata-ai.onrender.com">

  <title>FreeData.AI</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; background: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #fd-boot-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px; text-align: center; color: #0f172a;
      background-color: #f8fafc;
      background-image:
        radial-gradient(circle at 50% 42%, rgba(2, 132, 199, 0.08) 0%, rgba(248, 250, 252, 0) 58%),
        linear-gradient(to right, rgba(148, 163, 184, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(148, 163, 184, 0.08) 1px, transparent 1px);
      background-size: 100% 100%, 36px 36px, 36px 36px;
      transition: opacity 0.28s cubic-bezier(0.16, 1, 0.3, 1), transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .fd-boot-card {
      display: flex; flex-direction: column; align-items: center; max-width: 380px; width: 100%;
    }
    .fd-boot-ring {
      position: relative; width: 64px; height: 64px; margin-bottom: 18px;
      display: flex; align-items: center; justify-content: center;
    }
    .fd-boot-ring::before {
      content: ""; position: absolute; inset: -6px; border-radius: 20px;
      background: rgba(2, 132, 199, 0.12);
      animation: fdPulse 2s ease-in-out infinite;
    }
    .fd-boot-badge {
      position: relative; width: 64px; height: 64px; border-radius: 16px; overflow: hidden;
      background: #ffffff; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 12px 28px rgba(2, 132, 199, 0.22), 0 0 0 1px rgba(15, 23, 42, 0.06);
    }
    .fd-boot-badge img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .fd-boot-title {
      font-size: 20px; font-weight: 800; letter-spacing: -0.02em; color: #0f172a; margin-bottom: 4px;
    }
    .fd-boot-tagline {
      font-size: 12.5px; font-weight: 600; color: #475569; letter-spacing: 0.01em; margin-bottom: 18px;
    }
    .fd-boot-bar {
      width: 210px; height: 3.5px; border-radius: 999px; background: #e2e8f0; overflow: hidden;
    }
    .fd-boot-bar::after {
      content: ""; display: block; width: 42%; height: 100%;
      background: linear-gradient(90deg, #0284c7, #0ea5e9); border-radius: 999px;
      animation: fdSlide 1.15s ease-in-out infinite;
    }
    .fd-boot-status {
      margin-top: 12px; font-size: 12.5px; color: #64748b; min-height: 18px; transition: opacity 0.18s ease;
    }
    .fd-boot-slow {
      margin-top: 6px; font-size: 11.5px; color: #0369a1; opacity: 0; transition: opacity 0.25s ease;
    }
    .fd-boot-trust {
      position: fixed; bottom: 22px; left: 16px; right: 16px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      font-size: 11.5px; font-weight: 500; color: #64748b;
    }
    @keyframes fdSlide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
    @keyframes fdPulse { 0%, 100% { transform: scale(0.96); opacity: 0.55; } 50% { transform: scale(1.06); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .fd-boot-bar::after, .fd-boot-ring::before { animation: none; }
      #fd-boot-splash { transition: none; }
    }
  </style>
</head>
<body>
  <div id="fd-boot-splash" role="status" aria-live="polite" aria-label="Chargement FreeData.AI">
    <div class="fd-boot-card">
      <div class="fd-boot-ring">
        <div class="fd-boot-badge">
          <img src="icons/Icon-192.png" alt="Logo FreeData.AI" width="64" height="64" />
        </div>
      </div>
      <div class="fd-boot-title">FreeData.AI</div>
      <div class="fd-boot-tagline">Intelligence Décisionnelle Multi-Sectorielle</div>
      <div class="fd-boot-bar"></div>
      <div id="fd-boot-status" class="fd-boot-status">Initialisation de l’espace sécurisé…</div>
      <div id="fd-boot-slow" class="fd-boot-slow">Connexion lente détectée, chargement toujours en cours…</div>
    </div>
    <div class="fd-boot-trust">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      <span>Session chiffrée · Modèles &amp; Données vérifiées · Standard &amp; PRO</span>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    (function () {
      var statusEl = document.getElementById('fd-boot-status');
      var slowEl = document.getElementById('fd-boot-slow');
      var steps = [
        'Initialisation de l’espace sécurisé…',
        'Préparation des tableaux de bord & modèles…',
        'Finalisation de l’interface…'
      ];
      var stepIdx = 0;
      var stepTimer = setInterval(function () {
        if (!statusEl) return;
        stepIdx = Math.min(steps.length - 1, stepIdx + 1);
        statusEl.textContent = steps[stepIdx];
        if (stepIdx >= steps.length - 1) clearInterval(stepTimer);
      }, 1400);
      var slowTimer = setTimeout(function () {
        if (slowEl) slowEl.style.opacity = '1';
      }, 8000);

      window.addEventListener('flutter-first-frame', function () {
        clearInterval(stepTimer);
        clearTimeout(slowTimer);
        var splash = document.getElementById('fd-boot-splash');
        if (splash) {
          splash.style.opacity = '0';
          splash.style.transform = 'scale(0.985)';
          setTimeout(function () { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 300);
        }
        try {
          var url = new URL(window.location.href);
          if (url.searchParams.has('key') || url.searchParams.has('premium_key')) {
            url.searchParams.delete('key');
            url.searchParams.delete('premium_key');
            window.history.replaceState({}, document.title, url.pathname + (url.search ? url.search : '') + url.hash);
          }
        } catch (e) {}
      }, { once: true });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
