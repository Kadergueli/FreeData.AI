<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="FreeData.AI — Plateforme d'IA multi-domaines : assistance intelligente, recherche documentaire (RAG), analyse de données, prévisions ML et rapports PDF.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FreeData.AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="preconnect" href="https://freedata-ai.onrender.com" crossorigin>
  <link rel="dns-prefetch" href="https://freedata-ai.onrender.com">

  <title>FreeData.AI</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #fd-boot-splash {
      position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #ffffff; color: #0f172a;
      transition: opacity 0.2s ease-out;
    }
    .fd-boot-badge {
      width: 48px; height: 48px; border-radius: 12px; background: #0284c7; color: #ffffff;
      display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px;
      margin-bottom: 14px; box-shadow: 0 8px 20px rgba(2, 132, 199, 0.22);
    }
    .fd-boot-title { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 6px; }
    .fd-boot-sub { font-size: 13px; color: #64748b; }
    .fd-boot-bar {
      width: 160px; height: 3px; border-radius: 999px; background: #e2e8f0; overflow: hidden; margin-top: 16px;
    }
    .fd-boot-bar::after {
      content: ""; display: block; width: 45%; height: 100%; background: #0284c7; border-radius: 999px;
      animation: fdSlide 1.1s ease-in-out infinite;
    }
    @keyframes fdSlide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
  </style>
</head>
<body>
  <div id="fd-boot-splash" aria-label="Chargement FreeData.AI">
    <div class="fd-boot-badge">FD</div>
    <div class="fd-boot-title">FreeData.AI</div>
    <div class="fd-boot-sub">Préparation de votre espace analytique…</div>
    <div class="fd-boot-bar"></div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('fd-boot-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function () { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 220);
      }
      try {
        var url = new URL(window.location.href);
        if (url.searchParams.has('key') || url.searchParams.has('premium_key')) {
          url.searchParams.delete('key');
          url.searchParams.delete('premium_key');
          window.history.replaceState({}, document.title, url.pathname + (url.search ? url.search : '') + url.hash);
        }
      } catch (e) {}
    }, { once: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
