name: Temporary Dart formatter inspection
on:
  push:
    branches:
      - feat/auth-brand-positioning
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
      - working-directory: frontend_flutter
        run: dart format --output=show test/auth_dialog_test.dart
