name: Monthly Data Publication

on:
  schedule:
    # Exécution mensuelle le 2 du mois à 04:00 UTC (aucun secret supposé configuré par défaut)
    - cron: "0 4 2 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Calcul et validation uniquement (sans publication)"
        required: false
        default: "true"
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATA_BACKEND: supabase_rest
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Exécuter le pipeline de publication
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ] || [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "Mode dry-run (secrets absents ou dry_run=true)."
            python -m scripts.publish_pipeline --dry-run
          else
            python -m scripts.publish_pipeline --api-url "${API_BASE_URL}"
          fi

