name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python (Tests & Audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt
      - name: Tests unitaires & fonctionnels
        run: python -m pytest -q
      - name: Audit des vulnérabilités Python
        run: pip-audit -r requirements.txt

  flutter:
    name: Flutter Web (Format, Analyze, Test & Build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Installer les paquets Flutter
        run: flutter pub get
      - name: Vérifier le formatage Dart
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyse statique Flutter
        run: flutter analyze --no-fatal-infos
      - name: Tests Flutter
        run: flutter test
      - name: Build Flutter Web (release)
        run: flutter build web --release

  integration:
    name: Contrats API, Sécurité Frontend & Configs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt
      - name: Valider contrats API, absence de secrets frontend et configs
        run: python -m pytest -v tests/test_api_contracts.py
